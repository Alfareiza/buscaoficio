name: pre-commit

# Skip when the diff is only files no hook actually targets. In-scope:
# .py (ruff, debug-statements, OpenAPI), nextjs-frontend js/jsx/ts/tsx
# (eslint/prettier/tsc), pyproject.toml + openapi.json (schema/client
# generation), plus this workflow and .pre-commit-config.yaml.
# Out of scope (do not add to `paths` below): .md, .yml/.yaml, .html,
# .css, .svg, .png/.jpg/.jpeg/.webp/.gif/.ico, .woff/.woff2, .json
# (except openapi.json), .lock, .ini, .txt, .sh, .mjs, Dockerfiles,
# Makefile, Caddyfile.
on:
  push:
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/pre-commit.yml"
      - "**/*.py"
      - "nextjs-frontend/**/*.js"
      - "nextjs-frontend/**/*.jsx"
      - "nextjs-frontend/**/*.ts"
      - "nextjs-frontend/**/*.tsx"
      - "**/pyproject.toml"
      - "**/openapi.json"
  pull_request:
    paths:
      - ".pre-commit-config.yaml"
      - ".github/workflows/pre-commit.yml"
      - "**/*.py"
      - "nextjs-frontend/**/*.js"
      - "nextjs-frontend/**/*.jsx"
      - "nextjs-frontend/**/*.ts"
      - "nextjs-frontend/**/*.tsx"
      - "**/pyproject.toml"
      - "**/openapi.json"

jobs:
  pre-commit:

    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5433/testdatabase
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5433/testdatabase
      ACCESS_SECRET_KEY: test-access-secret
      RESET_PASSWORD_SECRET_KEY: test-reset-secret
      VERIFICATION_SECRET_KEY: test-verification-secret
      REGISTRATION_TOKEN_SECRET_KEY: test-registration-token-secret
      OPENAPI_OUTPUT_FILE: ../nextjs-frontend/openapi.json
      CORS_ORIGINS: '["*"]'


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        working-directory: ./fastapi_backend
        run: uv sync --all-extras --dev

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        working-directory: ./nextjs-frontend
        run: pnpm install

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1