name: CI

# Skip when the diff is only files neither test job uses. In-scope:
# FastAPI pytest (*.py, pyproject.toml, uv.lock, pytest.ini, alembic.ini,
# email templates, static assets, test fixtures), Next.js Jest
# (js/jsx/ts/tsx, package.json, pnpm-lock.yaml, tsconfig.json,
# next.config.mjs, openapi.json), plus this workflow.
# Out of scope (do not add to `paths` below): .md, other .yml/.yaml, .css,
# public/docs images, .woff/.woff2, .json (except the files listed), .txt,
# .sh, eslint .mjs, Dockerfiles, Makefile, Caddyfile.
on:
  push:
    paths:
      - ".github/workflows/ci.yml"
      - "**/*.py"
      - "**/pyproject.toml"
      - "fastapi_backend/uv.lock"
      - "fastapi_backend/pytest.ini"
      - "fastapi_backend/alembic.ini"
      - "fastapi_backend/app/email_templates/**"
      - "fastapi_backend/app/static/**"
      - "fastapi_backend/tests/**"
      - "nextjs-frontend/**/*.js"
      - "nextjs-frontend/**/*.jsx"
      - "nextjs-frontend/**/*.ts"
      - "nextjs-frontend/**/*.tsx"
      - "nextjs-frontend/package.json"
      - "nextjs-frontend/pnpm-lock.yaml"
      - "nextjs-frontend/tsconfig.json"
      - "nextjs-frontend/next.config.mjs"
      - "**/openapi.json"
  pull_request:
    paths:
      - ".github/workflows/ci.yml"
      - "**/*.py"
      - "**/pyproject.toml"
      - "fastapi_backend/uv.lock"
      - "fastapi_backend/pytest.ini"
      - "fastapi_backend/alembic.ini"
      - "fastapi_backend/app/email_templates/**"
      - "fastapi_backend/app/static/**"
      - "fastapi_backend/tests/**"
      - "nextjs-frontend/**/*.js"
      - "nextjs-frontend/**/*.jsx"
      - "nextjs-frontend/**/*.ts"
      - "nextjs-frontend/**/*.tsx"
      - "nextjs-frontend/package.json"
      - "nextjs-frontend/pnpm-lock.yaml"
      - "nextjs-frontend/tsconfig.json"
      - "nextjs-frontend/next.config.mjs"
      - "**/openapi.json"

jobs:
  build-fastapi:
    name: FastAPI CI

    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5433/testdatabase
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5433/testdatabase
      ACCESS_SECRET_KEY: test-access-secret
      RESET_PASSWORD_SECRET_KEY: test-reset-secret
      VERIFICATION_SECRET_KEY: test-verification-secret
      REGISTRATION_TOKEN_SECRET_KEY: test-registration-token-secret
      CORS_ORIGINS: '["*"]'

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: testdatabase
        ports:
          - 5433:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install the project
        working-directory: ./fastapi_backend
        run: uv sync --all-extras --dev

      - name: Run tests
        working-directory: ./fastapi_backend
        run: uv run coverage run -m pytest

      - name: Generate XML coverage report
        working-directory: ./fastapi_backend
        run: uv run coverage xml -o coverage.xml

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2.3.4
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: python-coverage
          parallel: true
          path-to-lcov: fastapi_backend/coverage.xml

  build-frontend:
    name: Next.js CI

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        working-directory: ./nextjs-frontend
        run: pnpm install

      - name: Run tests
        working-directory: ./nextjs-frontend
        run: pnpm run coverage

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2.3.4
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: node-coverage
          parallel: true

  finish:

    name: Coveralls

    needs: [ build-fastapi, build-frontend ]

    runs-on: ubuntu-latest

    steps:
      - name: Close parallel build
        uses: coverallsapp/github-action@v2.3.4
        continue-on-error: true
        with:
          parallel-finished: true
          carryforward: "python-coverage,node-coverage"