name: Run Database Migrations

# Runs Alembic migrations directly against the database using uv.
# No EC2 SSH required — DATABASE_URL is supplied as a GitHub Actions secret
# and is the only env var Alembic needs (see alembic_migrations/env.py).
#
# Previous approach (EC2 era): SSH into the box and exec Alembic inside the
# running backend container. That config is preserved in the `ec2` branch.

on:
  push:
    branches:
      - main
    paths:
      - "fastapi_backend/alembic_migrations/**"
      - "fastapi_backend/alembic.ini"
      - ".github/workflows/migrate.yml"
  workflow_dispatch: {}

jobs:
  migrate:
    name: Run Alembic Migration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies (including dev group for Alembic)
        working-directory: fastapi_backend
        run: uv sync --group dev

      - name: Run Alembic migrations
        working-directory: fastapi_backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run alembic upgrade head
