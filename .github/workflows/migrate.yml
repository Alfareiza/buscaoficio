name: Run Database Migrations

# Runs Alembic migrations by SSH-ing into the EC2 box and executing
# `alembic upgrade head` inside the running backend container.
# The container already has all env vars (DATABASE_URL, etc.) loaded
# from the on-box .env, so no secrets need to be passed here.

on:
  push:
    branches:
      - main
    paths:
      - "fastapi_backend/alembic_migrations/**"
      - "fastapi_backend/alembic.ini"
      - ".github/workflows/migrate.yml"
  workflow_dispatch: {}

jobs:
  migrate:
    name: Run Alembic Migration
    runs-on: ubuntu-latest
    steps:
      - name: Run alembic upgrade head on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/buscaoficio
            docker compose -f docker-compose.prod.yml exec -T backend \
              alembic upgrade head
