name: Infra files are manual on EC2 — DISABLED on this branch

# ⚠️  EC2 was terminated 2026-09-05. This reminder fails the build when
# docker-compose.prod.yml / Caddyfile change so someone copies them onto
# the box. That is only meaningful on branch `ec2`.
# Current production: Vercel. Push trigger removed so this cannot fail CI.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Only run this on branch ec2 if the box exists"
        required: true

jobs:
  remind:
    name: Copy these files onto the box yourself
    if: github.ref == 'refs/heads/ec2'
    runs-on: ubuntu-latest
    steps:
      - name: Fail with a reminder
        run: |
          echo "::warning title=EC2 infra files are not deployed::See branch ec2 / docs/ec2-recovery.md"
          exit 1
